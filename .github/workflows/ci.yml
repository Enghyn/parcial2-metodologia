name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .[dev]
        working-directory: .
      - run: ruff check src/backend test/backend
      - run: pytest test/backend -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
        working-directory: .
      - run: npx tsc --noEmit
        working-directory: .
      - run: npx eslint src/frontend --max-warnings 0
        working-directory: .
